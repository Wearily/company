<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B5.2m · New game, map shown</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bp{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f7;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.mat{background:rgba(28,28,30,.88);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#98989f}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:50px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:#f5f5f7;font:500 14px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#f5f5f7;cursor:pointer}
.cta{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 24px;border:0;border-radius:999px;background:#0a84ff;color:#fff;font:600 15px Inter,-apple-system,sans-serif;cursor:pointer}
.seg{display:flex;padding:2px;border-radius:10px;background:rgba(118,118,128,.24)}
.sg{flex:1;height:36px;border:0;border-radius:8px;background:transparent;font:500 13px Inter,sans-serif;color:#f5f5f7;cursor:pointer}
.sg.on{background:rgba(255,255,255,.24);font-weight:600}
</style>
</helmet>
<div class="bp" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battlefield preview, free to pan and zoom" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<header class="mat" style="position: absolute; left: 0; right: 0; top: 0; height: 60px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08)">
<div class="seg" style="flex: 1" role="radiogroup" aria-label="Map view"><button class="sg on" role="radio" aria-checked="true">Satellite</button><button class="sg" role="radio" aria-checked="false">Strategic</button></div>
</header>
<div style="position: absolute; left: 0; right: 0; top: 72px; text-align: center; font-size: 12.5px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.55)">Drag to pan · Pinch to zoom</div>

<div class="mat" style="position: absolute; right: 12px; top: 300px; display: flex; flex-direction: column; padding: 3px; border-radius: 22px; box-shadow: 0 0 0 1px rgba(255,255,255,.08)" role="toolbar" aria-label="Map controls">
<button class="ib" aria-label="Zoom in"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
<div style="height: 1px; margin: 0 8px; background: rgba(255,255,255,.1)"></div>
<button class="ib" aria-label="Zoom out"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12"/></svg></button>
<div style="height: 1px; margin: 0 8px; background: rgba(255,255,255,.1)"></div>
<button class="ib" aria-label="Fit whole battlefield"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
</div>

<section class="mat" role="dialog" aria-label="New game, collapsed" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; padding: 7px 16px 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 -8px 24px rgba(0,0,0,.35)">
<div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(235,235,245,.3); margin: 0 auto 12px" aria-hidden="true"></div>
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 0 2px">
<img src="../assets/logo-light.svg" alt="COMPANY" style="height: 18px; width: auto">
<div style="flex: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 600; letter-spacing: -.015em">Standard Battle</div>
<div class="s2" style="font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">River Town · Temperate · Attack · Normal</div>
</div>
</div>
<div style="display: flex; gap: 10px">
<a class="bt" href="B5m-NewGame.dc.html" style="flex: 1"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h2M8 14h9"/><circle cx="13.5" cy="6" r="1.8"/><circle cx="6.5" cy="14" r="1.8"/></svg>Settings</a>
<button class="cta" style="flex: 1">Start</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
