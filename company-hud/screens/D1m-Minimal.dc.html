<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D1m · In battle, minimal</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bp{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1d1d1f;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.mat{background:rgba(246,246,248,.84);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#6e6e73}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:#1d1d1f;font:500 13px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.b:hover{background:rgba(0,0,0,.08)}
.ic{width:44px;padding:0}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:62px;height:52px;padding:0 6px;border:0;border-radius:19px;background:transparent;color:#1d1d1f;font:500 10.5px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.tb:disabled{color:rgba(29,29,31,.3);cursor:default}
.tb.on{color:#007aff}
.dv{width:1px;align-self:stretch;background:rgba(0,0,0,.1);margin:10px 4px;flex:none}
.hs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="bp" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battle map: River Polow, Selitz and Hill 400" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<header class="mat" style="position: absolute; left: 0; right: 0; top: 0; height: 60px; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 -1px 0 rgba(0,0,0,.08), 0 1px 0 rgba(0,0,0,.06)">
<button class="b ic" aria-label="Show outliner"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></svg></button>
<button class="b" style="gap: 8px; padding: 0 6px" aria-label="12:40 remaining. A, B and C held by defender. Reinforcements in 2:30">
<span class="tn" style="font-size: 17px; font-weight: 600; letter-spacing: -.02em">12:40</span>
<span style="display: flex; gap: 3px">
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">A</text></svg>
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">B</text></svg>
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">C</text></svg>
</span>
<span class="s2 tn" style="font-size: 12px">+2:30</span>
</button>
<span style="display: flex">
<button class="b ic" aria-label="Pause"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/></svg></button>
<button class="b" style="min-width: 40px; padding: 0 6px; font-weight: 600" aria-label="Speed 1×">1×</button>
<button class="b ic" aria-label="More"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
</span>
</header>

<button class="mat" style="position: absolute; left: 286px; top: 256px; width: 36px; height: 36px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,.08)" aria-label="Alert: Polow Bridge is defended. Expand">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #ff9500; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px">!</span>
</button>

<ol style="position: absolute; left: 20px; right: 90px; bottom: 140px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 18px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.55)" aria-label="Event log">
<li style="display: flex; gap: 10px; opacity: .75"><span class="tn" style="width: 34px; color: rgba(255,255,255,.75)">01:52</span><span>Enemy seen in Selitz · 4 units</span></li>
<li style="display: flex; gap: 10px"><span class="tn" style="width: 34px; color: rgba(255,255,255,.75)">02:14</span><span style="font-weight: 600">Air strike on Selitz east · 1 lost</span></li>
</ol>
<div style="position: absolute; right: 20px; bottom: 144px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
<span class="tn" style="font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7)">500 m</span>
<div style="width: 61px; height: 4px; border-radius: 2px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5)"></div>
</div>

<div class="mat hs" style="position: absolute; left: 0; right: 0; bottom: 78px; height: 48px; padding: 0 6px; gap: 2px; box-shadow: inset 0 1px 0 rgba(0,0,0,.08)" aria-label="Select by type, scrolls sideways">
<button class="b">All <span class="s2 tn">19</span></button>
<button class="b" aria-label="Select infantry, 10"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#17181c" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">10</span></button>
<button class="b" aria-label="Select armor, 4"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#17181c" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">4</span></button>
<button class="b" aria-label="Select artillery, 3"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5L14.5 13.5H1.5Z" fill="#17181c" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="tn">3</span></button>
<button class="b" aria-label="Select engineers, 2"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1L14 4.5V11.5L8 15L2 11.5V4.5Z" fill="#17181c" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">2</span></button>
<div class="dv"></div>
<button class="b ic" aria-label="Supply lines"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="4" cy="15" r="2"/><circle cx="16" cy="5" r="2"/><path d="M5.6 13.6c2-2 1.4-5.6 4.4-6.6 1.6-.5 3 .1 4.4-.6" stroke-dasharray="2 2.4"/></svg></button>
<button class="b ic" aria-label="Line of control"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5-4 4.5 2 7.5-1.5S15 7 18 9"/></svg></button>
</div>

<nav class="mat hs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; box-sizing: border-box; padding: 4px 6px 18px; gap: 0; box-shadow: inset 0 1px 0 rgba(0,0,0,.1)" aria-label="Orders, scrolls sideways">
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h12M11.5 5.5L16 10l-4.5 4.5"/></svg>Move</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10h9M8 6l4 4-4 4M16.5 4.5v11"/></svg>Attack-move</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/></svg>Fire</button>
<button class="tb" aria-label="Air strike, 2 left"><span style="position: relative; display: flex"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.8c.9 0 1.4.9 1.4 2v3.7l6.3 3.7v1.8l-6.3-1.9v3.6l2.1 1.6V18L10 17.3 6.5 18v-1.7l2.1-1.6v-3.6l-6.3 1.9v-1.8l6.3-3.7V3.8c0-1.1.5-2 1.4-2z"/></svg><span style="position: absolute; left: 14px; top: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: #007aff; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #f8f8fa">2</span></span>Air Strike</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z"/></svg>Hold</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 14h16M4.5 14v-4M15.5 14v-4M4.5 10c3.5-3 7.5-3 11 0"/></svg>Pontoon</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 3.2a3.8 3.8 0 0 0-4.9 4.9L3 13l4 4 4.9-4.9a3.8 3.8 0 0 0 4.9-4.9l-2.3 2.3-2.4-.6-.6-2.4z"/></svg>Repair</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
