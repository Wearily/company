<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C3m · All collapsed</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ap{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f7;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.gl{background:rgba(30,30,32,.74);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:22px;box-shadow:0 0 0 .5px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.08)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#98989f}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:0;background:transparent;color:#f5f5f7;font:500 13px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.bt:hover{background:rgba(255,255,255,.08)}
.bt:disabled{color:rgba(245,245,247,.3);cursor:default;background:transparent}
.bt.gl{background:rgba(30,30,32,.74)}
.ic{width:44px;padding:0}
.dv{width:.5px;align-self:stretch;background:rgba(255,255,255,.12);margin:10px 3px;flex:none}
.hs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="ap" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battle map with the interface collapsed" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<button class="bt gl" style="position: absolute; left: 16px; top: 16px; height: 44px; border-radius: 22px; padding: 0 12px 0 14px; gap: 8px" aria-label="12:40 remaining. A, B and C held by defender. Expand">
<span class="tn" style="font-size: 16px; font-weight: 600; letter-spacing: -.02em">12:40</span>
<span style="display: flex; gap: 3px">
<svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">A</text></svg>
<svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">B</text></svg>
<svg width="22" height="22" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">C</text></svg>
</span>
</button>
<button class="bt ic gl" style="position: absolute; right: 16px; top: 16px" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/></svg></button>

<button class="bt ic gl" style="position: absolute; left: 16px; top: 72px" aria-label="Show panels"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></svg></button>
<button class="bt ic gl" style="position: absolute; right: 16px; top: 72px" aria-label="More"><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>

<button class="bt gl" style="position: absolute; left: 286px; top: 256px; width: 36px; height: 36px; min-width: 36px; padding: 0; border-radius: 18px" aria-label="Alert: Polow Bridge is defended. Expand">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #ff9f0a; display: flex; align-items: center; justify-content: center; color: #1c1c1e; font-weight: 700; font-size: 14px">!</span>
</button>

<button class="bt" style="position: absolute; left: 12px; bottom: 82px; height: 32px; padding: 0 8px; gap: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.55); font-size: 12px" aria-label="Latest event. Expand event log">
<span class="tn" style="color: rgba(255,255,255,.75); font-weight: 400">02:14</span><span style="font-weight: 600">Air strike on Selitz east</span>
<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
</button>

<div class="gl hs" style="position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 3px; border-radius: 25px" role="toolbar" aria-label="Select and orders, compact">
<button class="bt" style="padding: 0 10px 0 12px; font-weight: 600" aria-label="Select by type, 19 units">All <span class="s2 tn" style="font-weight: 500">19</span></button>
<div class="dv"></div>
<button class="bt ic" disabled aria-label="Move"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h12M11.5 5.5L16 10l-4.5 4.5"/></svg></button>
<button class="bt ic" disabled aria-label="Attack-move"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10h9M8 6l4 4-4 4M16.5 4.5v11"/></svg></button>
<button class="bt ic" disabled aria-label="Fire mission"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/></svg></button>
<button class="bt ic" style="position: relative" aria-label="Air strike, 2 left"><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.8c.9 0 1.4.9 1.4 2v3.7l6.3 3.7v1.8l-6.3-1.9v3.6l2.1 1.6V18L10 17.3 6.5 18v-1.7l2.1-1.6v-3.6l-6.3 1.9v-1.8l6.3-3.7V3.8c0-1.1.5-2 1.4-2z"/></svg><span style="position: absolute; left: 25px; top: 6px; min-width: 14px; height: 14px; border-radius: 7px; background: #0a84ff; color: #fff; font: 600 9px Inter,sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px #1c1c1e">2</span></button>
<button class="bt ic" disabled aria-label="Hold"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z"/></svg></button>
<button class="bt ic" disabled aria-label="Pontoon bridge"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 14h16M4.5 14v-4M15.5 14v-4M4.5 10c3.5-3 7.5-3 11 0"/></svg></button>
<button class="bt ic" disabled aria-label="Repair road"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 3.2a3.8 3.8 0 0 0-4.9 4.9L3 13l4 4 4.9-4.9a3.8 3.8 0 0 0 4.9-4.9l-2.3 2.3-2.4-.6-.6-2.4z"/></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
