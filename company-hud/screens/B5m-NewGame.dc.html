<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B5m · New game</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bp{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f7;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.mat{background:rgba(28,28,30,.9);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#98989f}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:#f5f5f7;font:500 14px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.cta{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 24px;border:0;border-radius:999px;background:#0a84ff;color:#fff;font:600 15px Inter,-apple-system,sans-serif;cursor:pointer}
.lb{font-size:12px;font-weight:600;color:#98989f;margin:0 0 7px 4px}
.seg{display:flex;padding:2px;border-radius:10px;background:rgba(118,118,128,.24)}
.sg{flex:1;height:36px;padding:0 4px;border:0;border-radius:8px;background:transparent;font:500 12.5px Inter,sans-serif;color:#f5f5f7;cursor:pointer}
.sg.on{background:rgba(255,255,255,.24);font-weight:600}
.grp{background:rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.sr{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:52px;padding:7px 14px;border:0;background:transparent;text-align:left;font:inherit;font-size:14px;color:inherit;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.sr:last-child{box-shadow:none}
.sr.on{background:rgba(10,132,255,.2)}
.tile{height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.07);font:500 13px Inter,sans-serif;color:#f5f5f7;cursor:pointer}
.tile.on{background:rgba(10,132,255,.2);box-shadow:inset 0 0 0 1.5px #0a84ff;font-weight:600}
.fld{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font:500 14px Inter,sans-serif;color:#f5f5f7}
.sb{scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="bp" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #1c1c1e">
<section class="mat" role="dialog" aria-label="New game" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; padding: 0 8px; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08)">
<button class="bt" style="width: 44px; padding: 0; background: transparent; justify-self: start" aria-label="Close and go back to game"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
<h1 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.015em">New Game</h1>
<a class="bt" href="B5bm-NewGameMap.dc.html" style="justify-self: end; height: 36px; padding: 0 12px; font-size: 13px"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5l5-2 5 2 5-2v12l-5 2-5-2-5 2z"/><path d="M7.5 3v12M12.5 5v12"/></svg>Show Map</a>
</header>
<div class="sb" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 18px; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent)">
<div>
<div class="lb">Scenario</div>
<div class="grp" role="radiogroup" aria-label="Scenario">
<button class="sr on" role="radio" aria-checked="true"><span style="flex: 1"><span style="display: block; font-weight: 600">Standard Battle</span><span class="s2" style="font-size: 12.5px">Take or hold A, B and C over 15 minutes.</span></span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#409cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Last Stand</span><span class="s2" style="font-size: 12.5px">A thin defence holds out against a far larger attack.</span></span></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Blitz</span><span class="s2" style="font-size: 12.5px">A short clock and an armor-heavy attack.</span></span></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Seize the Crossing</span><span class="s2" style="font-size: 12.5px">Everything hinges on taking the bridge at A.</span></span></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Counterattack</span><span class="s2" style="font-size: 12.5px">The defender starts behind and must win ground back.</span></span></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Meeting Engagement</span><span class="s2" style="font-size: 12.5px">Both sides arrive at once, with no time to dig in.</span></span></button>
<button class="sr" role="radio" aria-checked="false"><span style="flex: 1"><span style="display: block; font-weight: 500">Night Assault</span><span class="s2" style="font-size: 12.5px">Short sight lines; the attack goes in after dark.</span></span></button>
</div>
</div>
<div>
<div class="lb">Battlefield</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px" role="radiogroup" aria-label="Battlefield">
<button class="tile on" role="radio" aria-checked="true">River Town</button>
<button class="tile" role="radio" aria-checked="false">Lake Narrows</button>
<button class="tile" role="radio" aria-checked="false">City Fight</button>
<button class="tile" role="radio" aria-checked="false">Open Steppe</button>
<button class="tile" role="radio" aria-checked="false">Mountain Pass</button>
<button class="tile" role="radio" aria-checked="false">Deep Woods</button>
</div>
</div>
<div><div class="lb">Climate</div><div class="seg" role="radiogroup" aria-label="Climate"><button class="sg on" role="radio" aria-checked="true">Temperate</button><button class="sg" role="radio" aria-checked="false">Arid</button><button class="sg" role="radio" aria-checked="false">Desert</button><button class="sg" role="radio" aria-checked="false">Winter</button><button class="sg" role="radio" aria-checked="false">Tundra</button></div></div>
<div><div class="lb">Side</div><div class="seg" role="radiogroup" aria-label="Side"><button class="sg on" role="radio" aria-checked="true">Attack</button><button class="sg" role="radio" aria-checked="false">Defend</button></div></div>
<div><div class="lb">Defense strength</div><div class="seg" role="radiogroup" aria-label="Defense strength"><button class="sg" role="radio" aria-checked="false">Light</button><button class="sg on" role="radio" aria-checked="true">Standard</button><button class="sg" role="radio" aria-checked="false">Heavy</button></div></div>
<div><div class="lb">Difficulty</div><div class="seg" role="radiogroup" aria-label="Difficulty"><button class="sg" role="radio" aria-checked="false">Easy</button><button class="sg on" role="radio" aria-checked="true">Normal</button><button class="sg" role="radio" aria-checked="false">Hard</button></div></div>
<div>
<label class="lb" for="bseedm" style="display: block">Map seed</label>
<div style="display: flex; gap: 8px"><input id="bseedm" class="fld tn" value="48213" style="flex: 1; min-width: 0; border: 0"><button class="bt">New Map</button></div>
</div>
<div>
<div class="lb">Game code</div>
<div style="display: flex; gap: 8px"><input class="fld tn" readonly value="ST-RT-TE-ASN-PGW" aria-label="Game code" style="flex: 1; min-width: 0; border: 0; letter-spacing: .02em; text-overflow: clip; white-space: nowrap"><button class="bt" aria-label="Copy shareable link"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="2"/><path d="M10.5 3.5V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>Copy Link</button></div>
</div>
</div>
<footer style="display: flex; gap: 10px; padding: 12px 16px 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08)">
<button class="bt" style="flex: 1; height: 50px; ">Back to Game</button>
<button class="cta" style="flex: 1">Start</button>
</footer>
</section>
</div>
