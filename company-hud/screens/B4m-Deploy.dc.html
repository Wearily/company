<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B4m · Defender deployment</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bp{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f7;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.mat{background:rgba(28,28,30,.86);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#98989f}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:#f5f5f7;font:500 13px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.ic{width:44px;padding:0}
.dv{width:1px;align-self:stretch;background:rgba(255,255,255,.1);margin:10px 4px;flex:none}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:72px;height:56px;padding:0 8px;border:0;border-radius:19px;background:transparent;color:#f5f5f7;font:500 11px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.tb.on{background:#0a84ff;color:#fff}
.hs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.hs::-webkit-scrollbar{display:none}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:999px;background:#0a84ff;color:#fff;font:600 15px Inter,-apple-system,sans-serif;letter-spacing:-.01em;cursor:pointer}
</style>
</helmet>
<div class="bp" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battle map during deployment" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<svg style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; pointer-events: none" viewBox="0 0 400 860" aria-hidden="true">
<path d="M150 296 L262 282" stroke="rgba(0,0,0,.45)" stroke-width="6" stroke-linecap="round" fill="none"/>
<path d="M150 296 L262 282" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" fill="none"/>
<circle cx="150" cy="296" r="5" fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
<circle cx="262" cy="282" r="9" fill="#fff" fill-opacity=".35" stroke="#fff" stroke-width="2"/>
</svg>
<div class="mat tn" style="position: absolute; left: 236px; top: 244px; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; box-shadow: 0 0 0 1px rgba(255,255,255,.08)">0.38 km</div>

<header class="mat" style="position: absolute; left: 0; right: 0; top: 0; height: 60px; box-sizing: border-box; padding: 0 6px 0 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08), 0 1px 0 rgba(0,0,0,.4)">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600; letter-spacing: -.015em">Deployment <span style="font-size: 11px; font-weight: 500; background: #7a2cbf; padding: 1px 7px; border-radius: 10px; margin-left: 2px">Defending</span></span><span class="s2" style="font-size: 11px">Clock starts at 15:00</span></span>
<span style="display: flex; align-items: center; gap: 3px">
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">A</text></svg>
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">B</text></svg>
<svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">C</text></svg>
<button class="b ic" aria-label="More"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
</span>
</header>

<button class="b" style="position: absolute; left: 12px; bottom: 236px; height: 32px; padding: 0 8px; gap: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.55); font-size: 12px" aria-label="Latest event. Expand event log">
<span style="color: rgba(255,255,255,.75); font-weight: 400">Setup</span><span style="font-weight: 600">Trench dug south of Selitz · 1.0 km</span>
</button>

<div class="mat hs" style="position: absolute; left: 0; right: 0; bottom: 178px; height: 48px; padding: 0 6px; gap: 2px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08)" aria-label="Select by type, scrolls sideways">
<button class="b">All <span class="s2 tn">21</span></button>
<button class="b" aria-label="Select infantry, 12"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#7a2cbf" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">12</span></button>
<button class="b" aria-label="Select armor, 3"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#7a2cbf" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">3</span></button>
<button class="b" aria-label="Select artillery, 4"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5L14.5 13.5H1.5Z" fill="#7a2cbf" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="tn">4</span></button>
<button class="b" aria-label="Select engineers, 2"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1L14 4.5V11.5L8 15L2 11.5V4.5Z" fill="#7a2cbf" stroke="#fff" stroke-width="1.5"/></svg><span class="tn">2</span></button>
<div class="dv"></div>
<button class="b ic" aria-label="Supply lines"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="4" cy="15" r="2"/><circle cx="16" cy="5" r="2"/><path d="M5.6 13.6c2-2 1.4-5.6 4.4-6.6 1.6-.5 3 .1 4.4-.6" stroke-dasharray="2 2.4"/></svg></button>
<button class="b ic" aria-label="Line of control"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5-4 4.5 2 7.5-1.5S15 7 18 9"/></svg></button>
</div>

<section class="mat" aria-label="Deployment" style="position: absolute; left: 0; right: 0; bottom: 0; height: 178px; box-sizing: border-box; padding: 10px 12px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.1)">
<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
<button class="tb on" aria-pressed="true" aria-label="Dig trench, active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12l2.7-4 2.7 4 2.6-4 2.7 4 2.6-4 2.7 4"/></svg>Dig Trench</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="s2" style="font-size: 11.5px">Budget</span><span class="tn" style="font-size: 12.5px"><b style="font-weight: 600">2.4</b><span class="s2"> of 4.0 km</span></span></div>
<div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden"><div style="width: 60%; height: 100%; border-radius: 3px; background: #0a84ff"></div></div>
<span class="s2" style="font-size: 11px; white-space: nowrap">Drag to draw trench</span>
</div>
<button class="tb" aria-label="Undo last trench"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5L3.5 9l4 4"/><path d="M3.5 9h8a5 5 0 0 1 0 10h-2"/></svg>Undo</button>
</div>
<button class="cta">Begin Battle<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l5 5-5 5"/></svg></button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
