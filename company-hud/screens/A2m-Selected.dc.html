<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A2m · Selection, panels open</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ap{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1d1d1f;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.gl{background:rgba(248,248,250,.74);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:22px;box-shadow:0 0 0 .5px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.85),0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#6e6e73}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:0;background:transparent;color:#1d1d1f;font:500 13px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.bt:hover{background:rgba(0,0,0,.055)}
.bt.gl{background:rgba(248,248,250,.74)}
.ic{width:44px;padding:0}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:60px;height:56px;padding:0 8px;border:0;border-radius:19px;background:transparent;color:#1d1d1f;font:500 11px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.tb:hover{background:rgba(0,0,0,.055)}
.tb.on{background:#007aff;color:#fff}
.tb:disabled{color:rgba(29,29,31,.3);cursor:default;background:transparent}
.hs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.hs::-webkit-scrollbar{display:none}
.seg{display:flex;padding:2px;border-radius:10px;background:rgba(118,118,128,.14)}
.sg{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font:500 13px Inter,sans-serif;color:#1d1d1f;cursor:pointer}
.sg.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
.grp{background:rgba(255,255,255,.66);border-radius:12px;overflow:hidden}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 14px;box-shadow:inset 0 -.5px 0 rgba(0,0,0,.1);font-size:14px}
.rw:last-child{box-shadow:none}
</style>
</helmet>
<div class="ap" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battle map with four units selected" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; gap: 8px; align-items: center">
<button class="bt gl" style="flex: 1; min-width: 0; height: 52px; border-radius: 26px; justify-content: space-between; padding: 0 12px 0 16px" aria-label="12:40 remaining. A, B and C held by defender. Reinforcements in 2:30. Expand">
<span class="tn" style="font-size: 18px; font-weight: 600; letter-spacing: -.02em">12:40</span>
<span style="display: flex; gap: 4px">
<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">A</text></svg>
<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">B</text></svg>
<svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7a2cbf" stroke-width="3.5"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">C</text></svg>
</span>
<span class="s2 tn" style="font-size: 12px">+2:30</span>
</button>
<div class="gl" style="display: flex; padding: 4px; border-radius: 26px; flex: none">
<button class="bt ic" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/></svg></button>
<button class="bt" style="padding: 0 10px; font-weight: 600" aria-label="Speed 1×, tap to change">1×</button>
</div>
</div>

<div class="gl" style="position: absolute; left: 50%; top: 80px; transform: translateX(-50%); padding: 8px 14px; border-radius: 16px; font-size: 12.5px; white-space: nowrap"><span style="font-weight: 600; color: #007aff">Move</span><span class="s2"> · Tap the map to move 4 units</span></div>

<section class="gl" aria-label="Inspector" style="position: absolute; left: 8px; right: 8px; bottom: 92px; border-radius: 30px; background: rgba(246,246,248,.88); padding: 6px 16px 16px">
<div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.3); margin: 0 auto 10px" aria-hidden="true"></div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px">
<span style="font-size: 17px; font-weight: 600; letter-spacing: -.015em">4 Selected</span>
<button class="bt" style="width: 32px; height: 32px; min-width: 32px; padding: 0; border-radius: 16px; background: rgba(118,118,128,.14)" aria-label="Close inspector"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
</div>
<div class="seg" style="margin-bottom: 14px" role="tablist" aria-label="Inspector sections">
<button class="sg on" role="tab" aria-selected="true">Selection</button>
<button class="sg" role="tab" aria-selected="false">Forces</button>
<button class="sg" role="tab" aria-selected="false">Legend</button>
</div>
<div style="display: flex; gap: 18px; padding: 0 4px 12px; font-size: 14px">
<span style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="#17181c"/></svg><span class="tn" style="font-weight: 600">2</span><span class="s2">Infantry</span></span>
<span style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5L15 14H1z" fill="#17181c"/></svg><span class="tn" style="font-weight: 600">2</span><span class="s2">Artillery</span></span>
</div>
<div style="padding: 0 4px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><span class="s2" style="font-size: 13px">Average health</span><span class="tn" style="font-size: 13px; font-weight: 600">92%</span></div>
<div style="height: 6px; border-radius: 3px; background: rgba(118,118,128,.2); overflow: hidden"><div style="width: 92%; height: 100%; border-radius: 3px; background: #34c759"></div></div>
</div>
<div class="grp">
<div class="rw"><span>State</span><span class="s2">Moving</span></div>
<div class="rw"><span>Supply</span><span style="display: flex; align-items: center; gap: 6px; color: #248a3d; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 4px; background: #34c759"></span>In supply</span></div>
<div class="rw"><span>Dug in</span><span class="s2 tn">0 of 4</span></div>
<div class="rw"><span>High ground</span><span class="s2">None</span></div>
</div>
</section>

<div class="gl hs" style="position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 5px; border-radius: 24px; gap: 1px" role="toolbar" aria-label="Orders, scrolls sideways">
<button class="tb on" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h12M11.5 5.5L16 10l-4.5 4.5"/></svg>Move</button>
<button class="tb"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10h9M8 6l4 4-4 4M16.5 4.5v11"/></svg>Attack-move</button>
<button class="tb"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/></svg>Fire</button>
<button class="tb" aria-label="Air strike, 2 left"><span style="position: relative; display: flex"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.8c.9 0 1.4.9 1.4 2v3.7l6.3 3.7v1.8l-6.3-1.9v3.6l2.1 1.6V18L10 17.3 6.5 18v-1.7l2.1-1.6v-3.6l-6.3 1.9v-1.8l6.3-3.7V3.8c0-1.1.5-2 1.4-2z"/></svg><span style="position: absolute; left: 14px; top: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: #007aff; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #f8f8fa">2</span></span>Air Strike</button>
<button class="tb"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z"/></svg>Hold</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 14h16M4.5 14v-4M15.5 14v-4M4.5 10c3.5-3 7.5-3 11 0"/></svg>Pontoon</button>
<button class="tb" disabled><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 3.2a3.8 3.8 0 0 0-4.9 4.9L3 13l4 4 4.9-4.9a3.8 3.8 0 0 0 4.9-4.9l-2.3 2.3-2.4-.6-.6-2.4z"/></svg>Repair</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
