<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B3m · All collapsed</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bp{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f7;font-size:13px;line-height:1.3;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.mat{background:rgba(28,28,30,.84);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%)}
.tn{font-variant-numeric:tabular-nums}
.s2{color:#98989f}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:#f5f5f7;font:500 13px Inter,-apple-system,sans-serif;cursor:pointer;white-space:nowrap;flex:none}
.b:disabled{color:rgba(245,245,247,.3);cursor:default}
.ic{width:44px;padding:0}
.dv{width:1px;align-self:stretch;background:rgba(255,255,255,.1);margin:10px 3px;flex:none}
.hs{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="bp" style="position: relative; width: 400px; height: 860px; overflow: hidden; background: #3d4430">
<img src="../assets/map-real.jpg" alt="Battle map with the interface collapsed" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

<header class="mat" style="position: absolute; left: 0; right: 0; top: 0; height: 48px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; justify-content: space-between; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08), 0 1px 0 rgba(0,0,0,.4)">
<button class="b" style="gap: 8px; padding: 0 10px" aria-label="12:40 remaining. A, B and C held by defender. Expand">
<span class="tn" style="font-size: 15px; font-weight: 600; letter-spacing: -.02em">12:40</span>
<span style="display: flex; gap: 3px">
<svg width="20" height="20" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">A</text></svg>
<svg width="20" height="20" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">B</text></svg>
<svg width="20" height="20" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#9d5cdb" stroke-width="4"/><text x="15" y="19.5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5f5f7">C</text></svg>
</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#98989f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
</button>
<span style="display: flex">
<button class="b ic" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1.2" fill="currentColor"/></svg></button>
<button class="b ic" aria-label="More"><svg width="17" height="17" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
</span>
</header>

<button class="mat" style="position: absolute; left: 0; top: 50%; margin-top: -60px; width: 26px; height: 120px; border: 0; border-radius: 0 13px 13px 0; color: #f5f5f7; font: 600 11.5px Inter, sans-serif; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.08)" aria-label="Show outliner"><span style="writing-mode: vertical-rl; transform: rotate(180deg)">Outliner</span></button>

<button class="mat" style="position: absolute; left: 286px; top: 256px; width: 36px; height: 36px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.08)" aria-label="Alert: Polow Bridge is defended. Expand">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #ff9f0a; display: flex; align-items: center; justify-content: center; color: #1c1c1e; font-weight: 700; font-size: 14px">!</span>
</button>

<button class="b" style="position: absolute; left: 12px; bottom: 76px; height: 32px; padding: 0 8px; gap: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.55); font-size: 12px" aria-label="Latest event. Expand event log">
<span class="tn" style="color: rgba(255,255,255,.75); font-weight: 400">02:14</span><span style="font-weight: 600">Air strike on Selitz east</span>
<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
</button>

<nav class="mat hs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; box-sizing: border-box; padding: 2px 4px 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.1)" aria-label="Select and orders, compact">
<button class="b" style="font-weight: 600" aria-label="Select by type, 19 units">All <span class="s2 tn" style="font-weight: 500">19</span></button>
<div class="dv"></div>
<button class="b ic" disabled aria-label="Move"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10h12M11.5 5.5L16 10l-4.5 4.5"/></svg></button>
<button class="b ic" disabled aria-label="Attack-move"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 10h9M8 6l4 4-4 4M16.5 4.5v11"/></svg></button>
<button class="b ic" disabled aria-label="Fire mission"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/></svg></button>
<button class="b ic" style="position: relative" aria-label="Air strike, 2 left"><svg width="19" height="19" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.8c.9 0 1.4.9 1.4 2v3.7l6.3 3.7v1.8l-6.3-1.9v3.6l2.1 1.6V18L10 17.3 6.5 18v-1.7l2.1-1.6v-3.6l-6.3 1.9v-1.8l6.3-3.7V3.8c0-1.1.5-2 1.4-2z"/></svg><span style="position: absolute; left: 25px; top: 6px; min-width: 14px; height: 14px; border-radius: 7px; background: #0a84ff; color: #fff; font: 600 9px Inter,sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px #1c1c1e">2</span></button>
<button class="b ic" disabled aria-label="Hold"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l6 2.2v4.6c0 3.8-2.6 6.6-6 8.2-3.4-1.6-6-4.4-6-8.2V4.7z"/></svg></button>
<button class="b ic" disabled aria-label="Pontoon bridge"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 14h16M4.5 14v-4M15.5 14v-4M4.5 10c3.5-3 7.5-3 11 0"/></svg></button>
<button class="b ic" disabled aria-label="Repair road"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 3.2a3.8 3.8 0 0 0-4.9 4.9L3 13l4 4 4.9-4.9a3.8 3.8 0 0 0 4.9-4.9l-2.3 2.3-2.4-.6-.6-2.4z"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"map":{"editor":"enum","options":["satellite","paper (stand-in)"],"default":"satellite"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const paper = (this.props.map ?? 'satellite') !== 'satellite';
return { paper, mapSrc: paper ? '../assets/map-paper-standin.svg' : '../assets/map-real.jpg' };
}
}
</script>
</body>
</html>
